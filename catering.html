<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering-Dania na zamówienie</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
<div class="kontener">
    <h1>Catering-Dania na zamówienie</h1>
    <div class="srodek">
        <h2>Dane zamówienia</h2>
        <div class="pole">
            <label for="dania">Wybierz danie:</label>
            <select id="dania">
                <optgroup label="Pizza">
                    <option value="margherita">Margheritta</option>
                    <option value="pepperoni">Pepperoni</option>
                </optgroup>
                <optgroup label="Zupa">
                    <option value="rosol">Rosół</option>
                    <option value="pomidorowa">Pomidorowa</option>
                </optgroup>
                <optgroup label="Sałatki">
                    <option value="grecka">Grecka</option>
                    <option value="wloska">Włoska</option>
                </optgroup>
                <optgroup label="Napoje-Zimne">
                    <option value="sokpom">Sok-Pomarańczowy</option>
                    <option value="sokjabl">Sok-Jabłkowy</option>
                </optgroup>
                <optgroup label="Napoje-Ciepłe">
                    <option value="kawa">Kawa</option>
                    <option value="herbata">Herbata</option>
                </optgroup>
            </select>
        </div>
        <div class="pole">
            <label for="dodatki">Dodatki:</label>
            <input type="text" id="dodatki" oninput="checkLetters()">
            <input type="checkbox" id="onlyLetters" disabled>
        </div>
        <div class="pole">
            <label for="ulica">Ulica:</label>
            <input type="text" id="ulica" oninput="checkLettersUlica()">
            <input type="checkbox" id="onlyLettersUlica" disabled>
        </div>
        <div class="pole">
            <label for="nr">Nr:</label>
            <input type="number" id="nr" oninput="checknumbersNr()">
            <input type="checkbox" id="onlynumbersNr" disabled>
        </div>
        <div class="pole">
            <label for="waga">Waga(kg):</label>
            <input type="number" id="waga" oninput="checknumbersWaga()" step="0.1" min="0.1">
            <input type="checkbox" id="onlynumbersWaga" disabled>
        </div>
        <div class="pole">
            <label for="telefon">Telefon:</label>
            <input type="tel" id="telefon" oninput="checknumbersTelefon()">
            <input type="checkbox" id="onlynumbersTelefon" disabled>
        </div>
        <div class="button">
            <button onclick="submitForm()">Wyślij</button>
            <span id="submitResult" class="submit-result"></span>
        </div>
    </div>
</div>

<script src="funkcja.js"></script>
</body>
</html>
